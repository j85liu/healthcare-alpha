# Universe of companies tracked across healthcare-alpha subsectors.
#
# Structure: one top-level key per subsector, each holding a `companies`
# list. When adding a new subsector's pipeline (see the top-level
# subsector folders), append a new block here rather than creating a
# separate file, so all tickers/CIKs live in one place.
#
# NOTE on CIK provenance: the medtech CIKs were filled in from memory and
# should be double-checked against
# https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany before relying
# on them for real pulls. The biopharma, life-sciences-tools, and
# managed-care CIKs added since were looked up directly against SEC's
# https://www.sec.gov/files/company_tickers.json, so should be accurate as
# of the lookup date, but SEC CIKs can still change (e.g. on M&A) — worth a
# spot-check if a pull ever 404s.
#
# Fields:
#   ticker: exchange ticker symbol
#   name:   legal / common company name
#   cik:    SEC Central Index Key (10-digit, zero-padded), used to query
#           the EDGAR company facts API at
#           https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json
#   theme:  the alt-data investment thesis this name is tracked under
#   procedure_codes: CMS CPT/HCPCS billing-code mapping for this company's
#     procedure(s), used by shared/cms.py to pull Medicare volume data.
#     See shared/cms.py's module docstring for the full research behind
#     each ticker's signal_reliability rating. Fields:
#       cpt_codes: list of CPT/HCPCS codes to pull volume for (may be empty
#         if no code isolates this company's procedure).
#       signal_reliability: "clean" | "proxy_only" | "unverified" — whether
#         medtech/pull_data.py should trust a CMS code-based pull for this
#         ticker (see shared/cms.py and medtech/pull_data.py for how each
#         tier is routed).
#       note: context on why the code is/isn't reliable, or what to use
#         instead.
#   fda_applicant_name: best-guess applicant name to query against openFDA's
#     device/510k.json (see shared/fda.py, pull_510k). NOTE: these are
#     placeholders, not verified — the name openFDA has on file for a
#     company is sometimes a legal entity or subsidiary name rather than
#     the public company name (e.g. we've already seen "Procept
#     Biorobotics" filings actually filed under "Procept Biorobotics,
#     Corporation" for older records), and openFDA's applicant search is a
#     full-text match, not an exact one, so it's easy to unknowingly pull
#     too broad or too narrow a set. Confirm each of these against real
#     pull_510k(...) output before trusting the resulting clearance counts.

medtech:
  companies:
    - ticker: ISRG
      name: Intuitive Surgical, Inc.
      cik: "0001035267"
      theme: robotic-assisted surgery adoption
      fda_applicant_name: Intuitive Surgical
      procedure_codes:
        cpt_codes: []
        signal_reliability: proxy_only
        note: >-
          No dedicated robotic code exists; base procedure codes (e.g.
          55866 for prostatectomy) can't distinguish robotic (da Vinci)
          from conventional laparoscopic. Use company-reported da Vinci
          procedure growth % as the interim proxy.

    - ticker: SYK
      name: Stryker Corporation
      cik: "0000230809"
      theme: robotic-assisted surgery adoption
      fda_applicant_name: Stryker
      procedure_codes:
        cpt_codes: ["20985"]  # placeholder — musculoskeletal navigation add-on
        signal_reliability: unverified
        note: >-
          Confirm against Stryker's own Mako reimbursement/coding guide
          before trusting this code as a clean isolator of Mako-assisted
          volume.

    - ticker: MDT
      name: Medtronic plc
      cik: "0001613103"
      theme: procedure volume recovery / robotic surgery entrant
      fda_applicant_name: Medtronic
      procedure_codes:
        cpt_codes: []
        signal_reliability: proxy_only
        note: >-
          No dedicated robotic code exists; base procedure codes can't
          distinguish robotic (Hugo) from conventional laparoscopic. Use
          company-reported Hugo procedure growth % as the interim proxy.

    - ticker: GMED
      name: Globus Medical, Inc.
      cik: "0001456904"
      theme: spine robotics adoption
      fda_applicant_name: Globus Medical
      procedure_codes:
        cpt_codes: []  # code TBD
        signal_reliability: unverified
        note: >-
          Likely candidate: a computer-assisted surgical navigation add-on
          code (cf. SYK's 20985), covering ExcelsiusGPS-assisted spine
          procedures. Confirm against Globus Medical's own reimbursement/
          coding guide before trusting any code here.

    - ticker: PRCT
      name: Procept BioRobotics Corporation
      cik: "0001748790"
      theme: robotic-assisted urology procedure adoption
      fda_applicant_name: PROCEPT BioRobotics
      procedure_codes:
        cpt_codes: ["0421T"]
        signal_reliability: clean
        note: >-
          Dedicated, code-isolated Aquablation procedure code (Category
          III; transitions to a Category I code effective 2026-01-01).
          Cleanly pullable from CMS claims data without a proxy.

